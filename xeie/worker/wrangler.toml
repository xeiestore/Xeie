name = "xeie-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

workers_dev = true
preview_urls = true

# Bind a KV namespace for orders (create with: npx wrangler kv namespace create ORDERS)
# Then replace the id below with the real one.
[[kv_namespaces]]
binding = "ORDERS"
id = "REPLACE_WITH_ORDERS_KV_ID"
preview_id = "REPLACE_WITH_ORDERS_KV_PREVIEW_ID"

# Secrets (set with wrangler secret put):
#   ADMIN_PASSWORD
#   CLOUDINARY_CLOUD_NAME
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
# Optional later:
#   RESEND_API_KEY   (for email notifications)
